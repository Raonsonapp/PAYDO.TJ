name: PAYDO TJ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PAYDO TJ APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.27.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Recreate Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          flutter create . \
            --platforms=android \
            --org=tj.paydo \
            --project-name=paydo_tj

      - name: Configure Android Gradle
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ============================================================
          # SETTINGS FILE
          # Flutter 3.27 uses settings.gradle (Groovy).
          # Support settings.gradle.kts too, just in case.
          # ============================================================

          settings_files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
          ]

          settings = next(
              (p for p in settings_files if p.exists()),
              None,
          )

          if settings is None:
              raise FileNotFoundError(
                  "Android settings.gradle / settings.gradle.kts not found"
              )

          text = settings.read_text()

          # Android Gradle Plugin
          text = re.sub(
              r'(id\s*[("]\s*com\.android\.application\s*[")]\s*version\s*[")])[^"]+([")]\s*apply\s+false)',
              r'\g<1>8.7.3\g<2>',
              text,
          )

          # Kotlin plugin
          text = re.sub(
              r'(id\s*[("]\s*org\.jetbrains\.kotlin\.android\s*[")]\s*version\s*[")])[^"]+([")]\s*apply\s+false)',
              r'\g<1>1.9.24\g<2>',
              text,
          )

          settings.write_text(text)

          print(f"Configured: {settings}")

          # ============================================================
          # APP BUILD FILE
          # Support BOTH Groovy and Kotlin DSL.
          # ============================================================

          app_files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          app = next(
              (p for p in app_files if p.exists()),
              None,
          )

          if app is None:
              raise FileNotFoundError(
                  "android/app/build.gradle / build.gradle.kts not found"
              )

          text = app.read_text()

          # Java 21
          text = text.replace(
              "JavaVersion.VERSION_17",
              "JavaVersion.VERSION_21",
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_21",
          )

          # Kotlin JVM 21, when Kotlin DSL is used
          text = text.replace(
              "JvmTarget.JVM_17",
              "JvmTarget.JVM_21",
          )

          text = text.replace(
              "JvmTarget.JVM_11",
              "JvmTarget.JVM_21",
          )

          # Kotlin compiler target, when Groovy DSL is used
          text = text.replace(
              "jvmTarget = '17'",
              "jvmTarget = '21'",
          )

          text = text.replace(
              'jvmTarget = "17"',
              'jvmTarget = "21"',
          )

          text = text.replace(
              "jvmTarget = '11'",
              "jvmTarget = '21'",
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "21"',
          )

          app.write_text(text)

          print(f"Configured: {app}")

          # ============================================================
          # APP NAME
          # ============================================================

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if manifest.exists():
              text = manifest.read_text()

              text = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="PAYDO TJ"',
                  text,
                  count=1,
              )

              manifest.write_text(text)

          print("Android configuration complete.")
          PY

      - name: Show Android files
        shell: bash
        run: |
          echo "===== Android structure ====="
          find android -maxdepth 3 -type f | sort | head -200

          echo "===== Settings ====="

          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          elif [ -f android/settings.gradle.kts ]; then
            cat android/settings.gradle.kts
          fi

          echo "===== App Gradle ====="

          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          fi

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get Again
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
