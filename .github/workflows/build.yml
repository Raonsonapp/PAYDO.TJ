name: PAYDO TJ — Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build PAYDO TJ APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Create a REAL Android platform
      - name: Generate Android platform
        shell: bash
        run: |
          set -e

          echo "Removing incomplete Android folder..."
          rm -rf android

          echo "Generating Android project..."
          flutter create . \
            --platforms=android \
            --org=tj.paydo \
            --project-name=paydo_tj

          echo "Android platform generated successfully."

      # 5. Set application name
      - name: Set PAYDO TJ app name
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i 's/android:label="[^"]*"/android:label="PAYDO TJ"/' "$MANIFEST"

          echo "Application name:"
          grep 'android:label=' "$MANIFEST" || true

      # 6. Configure Android Firebase only when secret exists
      - name: Configure Firebase
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -n "$FIREBASE_JSON" ]; then
            echo "Firebase secret found."

            mkdir -p android/app

            echo "$FIREBASE_JSON" | base64 --decode \
              > android/app/google-services.json

            echo "google-services.json created."

            # Add Google Services plugin
            python3 - <<'PY'
            from pathlib import Path

            p = Path("android/settings.gradle.kts")
            if p.exists():
                text = p.read_text()
                if "com.google.gms.google-services" not in text:
                    text = text.replace(
                        "plugins {",
                        'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                        1
                    )
                    p.write_text(text)

            p = Path("android/app/build.gradle.kts")
            if p.exists():
                text = p.read_text()
                if "com.google.gms.google-services" not in text:
                    text = text.replace(
                        "plugins {",
                        'plugins {\n    id("com.google.gms.google-services")',
                        1
                    )
                    p.write_text(text)
            PY

          else
            echo "No Firebase secret."
            echo "Building APK without Firebase native configuration."
          fi

      # 7. Dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 8. Generate Android launcher icon ONLY
      - name: Generate Android icon
        shell: bash
        run: |
          set -e

          # Make a temporary launcher-icons configuration
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text()

          start = text.find("\nflutter_launcher_icons:")
          if start != -1:
              text = text[:start]

          text += r'''

          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "assets/icons/app_icon.png"
            min_sdk_android: 21
          '''

          p.write_text(text)
          PY

          dart run flutter_launcher_icons

      # 9. Clean
      - name: Flutter Clean
        run: flutter clean

      # 10. Dependencies again after clean
      - name: Flutter Pub Get
        run: flutter pub get

      # 11. Build APK
      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
