name: PAYDO TJ — Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build PAYDO TJ APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create . \
            --platforms=android \
            --org=tj.paydo \
            --project-name=paydo_tj

      - name: Set PAYDO TJ app name
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="PAYDO TJ"/' "$MANIFEST"

      - name: Configure Firebase
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_JSON:-}" ]; then
            echo "Firebase secret not configured; continuing without google-services.json."
            exit 0
          fi

          mkdir -p android/app

          python3 -c 'import os,base64,json,pathlib; s=os.environ["FIREBASE_JSON"].strip(); raw=s.encode(); raw=raw if s.startswith("{") else base64.b64decode(raw); data=json.loads(raw); pathlib.Path("android/app/google-services.json").write_text(json.dumps(data,indent=2)+"\n")'

          python3 -c 'from pathlib import Path; p=Path("android/settings.gradle.kts"); t=p.read_text(); marker="plugins {"; line='\''    id("com.google.gms.google-services") version "4.4.2" apply false\n'\''; p.write_text(t.replace(marker, marker+"\n"+line, 1) if "com.google.gms.google-services" not in t else t)'
          python3 -c 'from pathlib import Path; p=Path("android/app/build.gradle.kts"); t=p.read_text(); marker="plugins {"; line='\''    id("com.google.gms.google-services")\n'\''; p.write_text(t.replace(marker, marker+"\n"+line, 1) if "com.google.gms.google-services" not in t else t)'

          echo "Firebase configured."

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Android icon
        shell: bash
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
