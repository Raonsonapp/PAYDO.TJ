name: PAYDO TJ — Android APK (offline UI)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build PAYDO TJ APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter 3.27.0 is kept deliberately for the current maplibre_gl 0.20.0.
      - name: Setup Flutter 3.27.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          cache: true

      # maplibre_gl 0.20.0's Android toolchain needs JDK 21.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Android platform with pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create . \
            --platforms=android \
            --org=tj.paydo \
            --project-name=paydo_tj

      - name: Set Android application label
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^\"]*"/android:label="PAYDO TJ"/' "$MANIFEST"

      - name: Set Java 21 compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          t = p.read_text()
          t = t.replace('JavaVersion.VERSION_17', 'JavaVersion.VERSION_21')
          t = t.replace('JvmTarget.JVM_17', 'JvmTarget.JVM_21')
          p.write_text(t)
          PY

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Android icon
        run: dart run flutter_launcher_icons

      - name: Flutter Clean
        run: flutter clean

      - name: Flutter Pub Get (after clean)
        run: flutter pub get

      # Backend/Firebase is intentionally not initialized yet.
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
