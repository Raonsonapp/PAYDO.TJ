name: PAYDO TJ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.0
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create . --platforms=android --org=tj.paydo --project-name=paydo_tj

      - name: Set Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()
          text = text.replace("JavaVersion.VERSION_17", "JavaVersion.VERSION_21")
          text = text.replace("JvmTarget.JVM_17", "JvmTarget.JVM_21")
          p.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Clean
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
