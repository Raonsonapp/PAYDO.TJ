name: CI — Analyze & Test

# Ин workflow дар ҳар push/PR ба таври худкор иҷро мешавад ва дар
# сервери GitHub (на дар муҳити Claude) кор мекунад — он ҷо Flutter
# SDK воқеан насб аст. Агар ин job сабз (✅) шавад, маънои онро дорад,
# ки коди Dart дуруст compile мешавад ва тестҳо мегузаранд.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  analyze_and_test:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/
        continue-on-error: true # то ҳол "warning", на "hard fail" — тавзеҳ дар docs/ci_cd.md

      - name: Analyze (flutter analyze)
        # Диққат: ҚАСДАН бе --fatal-infos. Лоиҳа lint-и услубии
        # require_trailing_commas дорад (analysis_options.yaml), ки
        # даҳҳо "info" (на "error") медиҳад — бо --fatal-infos онҳо
        # CI-ро сурх мекарданд бе он ки коде воқеан вайрон бошад.
        # flutter analyze пешфарз танҳо дар "error" ноком мешавад.
        run: flutter analyze

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14
