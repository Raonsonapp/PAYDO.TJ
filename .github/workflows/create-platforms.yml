name: PAYDO TJ — Create Platforms

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-platforms:
    name: Generate Flutter Platform Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate all platform folders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android ios web windows macos linux
          flutter create . \
            --platforms=android,ios,web,windows,macos,linux \
            --org=tj.paydo \
            --project-name=paydo_tj
          flutter pub get

      - name: Verify platform folders
        shell: bash
        run: |
          set -euo pipefail
          for dir in android ios web windows macos linux; do
            test -d "$dir"
            echo "OK: $dir"
          done

      - name: Create platform update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/generate-flutter-platforms
          delete-branch: true
          base: main
          title: "Generate Flutter platform files"
          commit-message: "Generate Flutter platform files"
          body: |
            Automatically generated Flutter platform folders:
            android, ios, web, windows, macos, linux.
          add-paths: |
            android/
            ios/
            web/
            windows/
            macos/
            linux/
