name: PAYDO TJ — Create Platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-platforms:
    name: Generate Flutter Platform Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Remove incomplete platform folders
        run: |
          rm -rf android ios windows macos linux web

      - name: Generate all Flutter platforms
        run: |
          flutter create . \
            --platforms=android,ios,windows,macos,linux,web \
            --org=tj.paydo \
            --project-name=paydo_tj

      - name: Restore dependencies
        run: flutter pub get

      - name: Verify generated platforms
        run: |
          set -e
          test -d android
          test -d ios
          test -d windows
          test -d macos
          test -d linux
          test -d web
          echo "All Flutter platform folders are OK."

      - name: Commit generated platforms
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android ios windows macos linux web

          if git diff --cached --quiet; then
            echo "No platform changes."
            exit 0
          fi

          git commit -m "Generate Flutter platform files"
          git push
